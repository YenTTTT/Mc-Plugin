# ==================== 烈焰系 (Fire) ====================
# 兩大分支：
#   爆發流（火焰術士）— 右側  主屬性：Magic
#   灼燒流（DOT流）  — 左側  主屬性：Magic + Spirit
# GUI 佈局 (row, col) → slot = row * 9 + col
fire:

  # ═══════════════════════════════════════════
  #  起始天賦（共用入口）
  # ═══════════════════════════════════════════

  # 火焰親和 (5,4) → slot 49 — 屬性加成：入門
  fire_affinity:
    name: "火焰親和"
    description: "與火焰建立親和力，增加 Magic"
    type: "PASSIVE"
    max-level: 1
    points-per-level: 1
    mechanism: "被動"
    gui:
      slot: 49
      icon: "MAGMA_CREAM"
    levels:
      1:
        effect:
          statBonus:
            magic: 10

  # 火花 (5,6) → slot 51 — 主動：發射小火球
  fire_spark:
    name: "火花"
    description: "發射一顆小型火球攻擊敵人"
    type: "ACTIVE"
    max-level: 1
    points-per-level: 1
    mechanism: "烈焰粉"
    cooldown: 3
    manaCost: 10
    trigger:
      type: "RIGHT_CLICK"
    gui:
      slot: 51
      icon: "BLAZE_POWDER"
    levels:
      1:
        effect:
          magicScaling: 1.2
          damageType: "MAGIC"
          range: 15

  # 溫度上升 (5,2) → slot 47 — 被動：技能造成燃燒
  heat_rising:
    name: "溫度上升"
    description: "你的火焰技能命中敵人時附加燃燒效果 (2秒)"
    type: "PASSIVE"
    max-level: 1
    points-per-level: 1
    mechanism: "被動"
    prerequisite:
      skill: "fire_affinity"
      level: 1
    gui:
      slot: 47
      icon: "CAMPFIRE"
    levels:
      1:
        effect:
          burnDuration: 2

  # ═══════════════════════════════════════════
  #  爆發流（火焰術士）— 右側
  # ═══════════════════════════════════════════

  # 炎熱 (4,6) → slot 42 — 屬性：+40 MANA
  blazing_mana:
    name: "炎熱"
    description: "火焰的力量增幅你的魔力容量"
    type: "PASSIVE"
    max-level: 1
    points-per-level: 1
    mechanism: "被動"
    prerequisite:
      skill: "fire_spark"
      level: 1
    gui:
      slot: 42
      icon: "LAVA_BUCKET"
    levels:
      1:
        effect:
          manaBonus: 40

  # 毀滅之球 (4,7) → slot 43 — 主動：巨型火球
  destruction_orb:
    name: "毀滅之球"
    description: "召喚一顆巨型火球緩慢往前推進，碰觸的敵人持續受到傷害"
    type: "ACTIVE"
    max-level: 3
    points-per-level: 1
    mechanism: "烈焰粉"
    cooldown: 12
    manaCost: 70
    trigger:
      type: "RIGHT_CLICK"
    prerequisite:
      skill: "blazing_mana"
      level: 1
    gui:
      slot: 43
      icon: "FIRE_CHARGE"
    levels:
      1:
        effect:
          magicScaling: 1.4
          damageType: "MAGIC"
          range: 15
          speed: 0.3
          radius: 2.0
          duration: 5
      2:
        effect:
          magicScaling: 1.8
          damageType: "MAGIC"
          range: 18
          speed: 0.3
          radius: 2.5
          duration: 6
      3:
        effect:
          magicScaling: 2.2
          damageType: "MAGIC"
          range: 20
          speed: 0.3
          radius: 3.0
          duration: 7

  # 烈焰風暴 (3,7) → slot 34 — 主動：範圍持續傷害
  flame_storm:
    name: "烈焰風暴"
    description: "在指定位置召喚火焰風暴，每秒造成魔法傷害 (持續5秒)"
    type: "ACTIVE"
    max-level: 3
    points-per-level: 1
    mechanism: "烈焰粉"
    cooldown: 15
    manaCost: 55
    trigger:
      type: "LEFT_CLICK"
    prerequisite:
      skill: "destruction_orb"
      level: 1
    gui:
      slot: 34
      icon: "BLAZE_ROD"
    levels:
      1:
        effect:
          magicScaling: 1.2
          damageType: "MAGIC"
          radius: 5
          duration: 5
          tickInterval: 20
      2:
        effect:
          magicScaling: 1.5
          damageType: "MAGIC"
          radius: 6
          duration: 6
          tickInterval: 20
      3:
        effect:
          magicScaling: 1.8
          damageType: "MAGIC"
          radius: 7
          duration: 7
          tickInterval: 20

  # 連鎖爆炸 (3,6) → slot 33 — 被動：命中時機率爆炸
  chain_explosion:
    name: "連鎖爆炸"
    description: "火焰技能擊中敵人時，有機率引發連鎖爆炸造成範圍傷害"
    type: "PASSIVE"
    max-level: 3
    points-per-level: 1
    mechanism: "被動"
    prerequisite:
      skill: "destruction_orb"
      level: 1
    gui:
      slot: 33
      icon: "TNT"
    levels:
      1:
        effect:
          explosionChance: 0.2
          explosionRadius: 3
          explosionDamagePercent: 0.5
      2:
        effect:
          explosionChance: 0.3
          explosionRadius: 3.5
          explosionDamagePercent: 0.65
      3:
        effect:
          explosionChance: 0.4
          explosionRadius: 4
          explosionDamagePercent: 0.8

  # 超載 (2,7) → slot 25 — 被動：技能傷害+30% 消耗增加
  overcharge:
    name: "超載"
    description: "你的火焰技能傷害增加，但 MANA 消耗也增加"
    type: "PASSIVE"
    max-level: 3
    points-per-level: 1
    mechanism: "被動"
    prerequisite:
