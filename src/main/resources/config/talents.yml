# ==================== 烈焰系 (Fire) ====================
# 兩大分支：
#   爆發流（火焰術士）— 右側  主屬性：Magic
#   灼燒流（DOT流）  — 左側  主屬性：Magic + Spirit
# GUI 佈局 (row, col) → slot = row * 9 + col
fire:

  # ═══════════════════════════════════════════
  #  起始天賦（共用入口）
  # ═══════════════════════════════════════════

  # 火焰親和 (5,4) → slot 49 — 屬性加成：入門
  fire_affinity:
    name: "火焰親和"
    description: "與火焰建立親和力，增加 Magic"
    type: "PASSIVE"
    max-level: 1
    points-per-level: 1
    mechanism: "被動"
    gui:
      slot: 49
      icon: "MAGMA_CREAM"
    levels:
      1:
        effect:
          statBonus:
            magic: 10

  # 火花 (5,6) → slot 51 — 主動：發射小火球
  fire_spark:
    name: "火花"
    description: "發射一顆小型火球攻擊敵人"
    type: "ACTIVE"
    max-level: 1
    points-per-level: 1
    mechanism: "烈焰粉"
    cooldown: 3
    manaCost: 10
    trigger:
      type: "RIGHT_CLICK"
    gui:
      slot: 51
      icon: "BLAZE_POWDER"
    levels:
      1:
        effect:
          magicScaling: 1.2
          damageType: "MAGIC"
          range: 15

  # 溫度上升 (5,2) → slot 47 — 被動：技能造成燃燒
  heat_rising:
    name: "溫度上升"
    description: "你的火焰技能命中敵人時附加燃燒效果 (2秒)"
    type: "PASSIVE"
    max-level: 1
    points-per-level: 1
    mechanism: "被動"
    prerequisite:
      skill: "fire_affinity"
      level: 1
    gui:
      slot: 47
      icon: "CAMPFIRE"
    levels:
      1:
        effect:
          burnDuration: 2

  # ═══════════════════════════════════════════
  #  爆發流（火焰術士）— 右側
  # ═══════════════════════════════════════════

  # 炎熱 (4,6) → slot 42 — 屬性：+40 MANA
  blazing_mana:
    name: "炎熱"
    description: "火焰的力量增幅你的魔力容量"
    type: "PASSIVE"
    max-level: 1
    points-per-level: 1
    mechanism: "被動"
    prerequisite:
      skill: "fire_spark"
      level: 1
    gui:
      slot: 42
      icon: "LAVA_BUCKET"
    levels:
      1:
        effect:
          manaBonus: 40

  # 毀滅之球 (4,7) → slot 43 — 主動：巨型火球
  destruction_orb:
    name: "毀滅之球"
    description: "召喚一顆巨型火球緩慢往前推進，碰觸的敵人持續受到傷害"
    type: "ACTIVE"
    max-level: 3
    points-per-level: 1
    mechanism: "烈焰粉"
    cooldown: 12
    manaCost: 70
    trigger:
      type: "RIGHT_CLICK"
    prerequisite:
      skill: "blazing_mana"
      level: 1
    gui:
      slot: 43
      icon: "FIRE_CHARGE"
    levels:
      1:
        effect:
          magicScaling: 1.4
          damageType: "MAGIC"
          range: 15
          speed: 0.3
          radius: 2.0
          duration: 5
      2:
        effect:
          magicScaling: 1.8
          damageType: "MAGIC"
          range: 18
          speed: 0.3
          radius: 2.5
          duration: 6
      3:
        effect:
          magicScaling: 2.2
          damageType: "MAGIC"
          range: 20
          speed: 0.3
          radius: 3.0
          duration: 7

  # 烈焰風暴 (3,7) → slot 34 — 主動：範圍持續傷害
  flame_storm:
    name: "烈焰風暴"
    description: "在指定位置召喚火焰風暴，每秒造成魔法傷害 (持續5秒)"
    type: "ACTIVE"
    max-level: 3
    points-per-level: 1
    mechanism: "烈焰粉"
    cooldown: 15
    manaCost: 55
    trigger:
      type: "LEFT_CLICK"
    prerequisite:
      skill: "destruction_orb"
      level: 1
    gui:
      slot: 34
      icon: "BLAZE_ROD"
    levels:
      1:
        effect:
          magicScaling: 1.2
          damageType: "MAGIC"
          radius: 5
          duration: 5
          tickInterval: 20
      2:
        effect:
          magicScaling: 1.5
          damageType: "MAGIC"
          radius: 6
          duration: 6
          tickInterval: 20
      3:
        effect:
          magicScaling: 1.8
          damageType: "MAGIC"
          radius: 7
          duration: 7
          tickInterval: 20

  # 連鎖爆炸 (3,6) → slot 33 — 被動：命中時機率爆炸
  chain_explosion:
    name: "連鎖爆炸"
    description: "火焰技能擊中敵人時，有機率引發連鎖爆炸造成範圍傷害"
    type: "PASSIVE"
    max-level: 3
    points-per-level: 1
    mechanism: "被動"
    prerequisite:
      skill: "destruction_orb"
      level: 1
    gui:
      slot: 33
      icon: "TNT"
    levels:
      1:
        effect:
          explosionChance: 0.2
          explosionRadius: 3
          explosionDamagePercent: 0.5
      2:
        effect:
          explosionChance: 0.3
          explosionRadius: 3.5
          explosionDamagePercent: 0.65
      3:
        effect:
          explosionChance: 0.4
          explosionRadius: 4
          explosionDamagePercent: 0.8

  # 超載 (2,7) → slot 25 — 被動：技能傷害+30% 消耗增加
  overcharge:
    name: "超載"
    description: "你的火焰技能傷害增加，但 MANA 消耗也增加"
    type: "PASSIVE"
    max-level: 3
    points-per-level: 1
    mechanism: "被動"
    prerequisite:
      anyOf:
        - skill: "flame_storm"
          level: 1
        - skill: "chain_explosion"
          level: 1
    gui:
      slot: 25
      icon: "NETHER_STAR"
    levels:
      1:
        effect:
          skillDamageBonus: 0.15
          manaCostIncrease: 0.10
      2:
        effect:
          skillDamageBonus: 0.25
          manaCostIncrease: 0.15
      3:
        effect:
          skillDamageBonus: 0.35
          manaCostIncrease: 0.20

  # 隕石術 (2,6) → slot 24 — 終極：召喚隕石
  meteor:
    name: "隕石術"
    description: "從天空召喚巨大隕石墜落，造成毀滅性範圍傷害"
    type: "ACTIVE"
    max-level: 3
    points-per-level: 1
    mechanism: "烈焰粉"
    cooldown: 30
    manaCost: 120
    trigger:
      type: "LEFT_CLICK_SNEAK"
    prerequisite:
      skill: "overcharge"
      level: 2
    gui:
      slot: 24
      icon: "MAGMA_BLOCK"
    levels:
      1:
        effect:
          magicScaling: 5.0
          damageType: "MAGIC"
          radius: 6
          fallDelay: 40
          burnDuration: 5
      2:
        effect:
          magicScaling: 6.5
          damageType: "MAGIC"
          radius: 7
          fallDelay: 35
          burnDuration: 6
      3:
        effect:
          magicScaling: 8.0
          damageType: "MAGIC"
          radius: 8
          fallDelay: 30
          burnDuration: 8

  # ═══════════════════════════════════════════
  #  灼燒流（DOT流）— 左側
  # ═══════════════════════════════════════════

  # 烈焰噴射 (4,2) → slot 38 — 主動：連續射火焰3秒
  flame_jet:
    name: "烈焰噴射"
    description: "連續射出烈焰持續3秒，灼燒前方敵人"
    type: "ACTIVE"
    max-level: 3
    points-per-level: 1
    mechanism: "烈焰粉"
    cooldown: 5
    manaCost: 18
    trigger:
      type: "LEFT_CLICK"
    prerequisite:
      skill: "heat_rising"
      level: 1
    gui:
      slot: 38
      icon: "BLAZE_POWDER"
    levels:
      1:
        effect:
          magicScaling: 1.0
          damageType: "MAGIC"
          range: 8
          duration: 3
          tickInterval: 5
          burnDuration: 3
      2:
        effect:
          magicScaling: 1.2
          damageType: "MAGIC"
          range: 9
          duration: 4
          tickInterval: 5
          burnDuration: 4
      3:
        effect:
          magicScaling: 1.4
          damageType: "MAGIC"
          range: 10
          duration: 5
          tickInterval: 5
          burnDuration: 5

  # 持續燃燒 (4,1) → slot 37 — 被動：燃燒時間+3秒
  burn_extend:
    name: "持續燃燒"
    description: "你施加的燃燒效果持續時間延長"
    type: "PASSIVE"
    max-level: 3
    points-per-level: 1
    mechanism: "被動"
    prerequisite:
      skill: "heat_rising"
      level: 1
    gui:
      slot: 37
      icon: "COAL"
    levels:
      1:
        effect:
          burnExtend: 2
      2:
        effect:
          burnExtend: 3
      3:
        effect:
          burnExtend: 5

  # 灼熱擴散 (3,2) → slot 29 — 被動：燃燒會傳染附近敵人
  burn_spread:
    name: "灼熱擴散"
    description: "燃燒中的敵人會將火焰傳染給附近的敵人"
    type: "PASSIVE"
    max-level: 3
    points-per-level: 1
    mechanism: "被動"
    prerequisite:
      anyOf:
        - skill: "flame_jet"
          level: 1
        - skill: "burn_extend"
          level: 1
    gui:
      slot: 29
      icon: "FIRE_CORAL"
    levels:
      1:
        effect:
          spreadRadius: 3
          spreadChance: 0.3
      2:
        effect:
          spreadRadius: 4
          spreadChance: 0.4
      3:
        effect:
          spreadRadius: 5
          spreadChance: 0.5

  # 熾熱波紋 (3,1) → slot 28 — 主動：火焰波紋
  scorching_wave:
    name: "熾熱波紋"
    description: "發出一道火焰波紋，灼燒路徑上的所有敵人"
    type: "ACTIVE"
    max-level: 3
    points-per-level: 1
    mechanism: "烈焰粉"
    cooldown: 6
    manaCost: 25
    trigger:
      type: "RIGHT_CLICK"
    prerequisite:
      skill: "burn_spread"
      level: 1
    gui:
      slot: 28
      icon: "BLAZE_ROD"
    levels:
      1:
        effect:
          magicScaling: 1.1
          damageType: "MAGIC"
          range: 10
          width: 3
          burnDuration: 3
      2:
        effect:
          magicScaling: 1.4
          damageType: "MAGIC"
          range: 12
          width: 4
          burnDuration: 4
      3:
        effect:
          magicScaling: 1.7
          damageType: "MAGIC"
          range: 14
          width: 5
          burnDuration: 5

  # 熾焰之環 (3,0) → slot 27 — 主動：以自身為中心AOE燃燒
  inferno_ring:
    name: "熾焰之環"
    description: "以自身為中心釋放火焰環，持續灼燒範圍內的敵人"
    type: "ACTIVE"
    max-level: 3
    points-per-level: 1
    mechanism: "烈焰粉"
    cooldown: 10
    manaCost: 35
    trigger:
      type: "LEFT_CLICK_SNEAK"
    prerequisite:
      anyOf:
        - skill: "scorching_wave"
          level: 1
        - skill: "burn_spread"
          level: 2
    gui:
      slot: 27
      icon: "FIRE_CHARGE"
    levels:
      1:
        effect:
          magicScaling: 0.8
          damageType: "MAGIC"
          radius: 5
          duration: 5
          tickInterval: 20
          burnDuration: 3
      2:
        effect:
          magicScaling: 1.0
          damageType: "MAGIC"
          radius: 6
          duration: 6
          tickInterval: 20
          burnDuration: 4
      3:
        effect:
          magicScaling: 1.2
          damageType: "MAGIC"
          radius: 7
          duration: 7
          tickInterval: 20
          burnDuration: 5

  # 燃燒堆疊 (2,1) → slot 19 — 核心被動：每層燃燒+10%傷害
  burn_stack:
    name: "燃燒堆疊"
    description: "燃燒中的目標每層燃燒受到額外傷害 (最多5層)"
    type: "PASSIVE"
    max-level: 3
    points-per-level: 1
    mechanism: "被動"
    prerequisite:
      anyOf:
        - skill: "inferno_ring"
          level: 1
        - skill: "scorching_wave"
          level: 1
    gui:
      slot: 19
      icon: "MAGMA_CREAM"
    levels:
      1:
        effect:
          damagePerStack: 0.08
          maxStacks: 5
      2:
        effect:
          damagePerStack: 0.12
          maxStacks: 5
      3:
        effect:
          damagePerStack: 0.15
          maxStacks: 5

  # 地獄領域 (2,0) → slot 18 — 終極：地面火海
  hell_domain:
    name: "地獄領域"
    description: "將腳下大片地面化為火海，持續灼燒所有踏入的敵人"
    type: "ACTIVE"
    max-level: 3
    points-per-level: 1
    mechanism: "烈焰粉"
    cooldown: 25
    manaCost: 90
    trigger:
      type: "RIGHT_CLICK"
    prerequisite:
      skill: "burn_stack"
      level: 2
    gui:
      slot: 18
      icon: "MAGMA_BLOCK"
    levels:
      1:
        effect:
          magicScaling: 0.6
          spiritScaling: 0.3
          damageType: "MAGIC"
          radius: 8
          duration: 8
          tickInterval: 10
          burnDuration: 5
      2:
        effect:
          magicScaling: 0.8
          spiritScaling: 0.4
          damageType: "MAGIC"
          radius: 10
          duration: 10
          tickInterval: 10
          burnDuration: 6
      3:
        effect:
          magicScaling: 1.0
          spiritScaling: 0.5
          damageType: "MAGIC"
          radius: 12
          duration: 12
          tickInterval: 10
          burnDuration: 8

