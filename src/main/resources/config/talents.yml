    name: "隕石術"
    description: "從天空召喚巨大隕石墜落，造成毀滅性範圍傷害"
    type: "ACTIVE"
    max-level: 3
    points-per-level: 1
    mechanism: "烈焰粉"
    cooldown: 30
    manaCost: 120
    trigger:
      type: "LEFT_CLICK_SNEAK"
    prerequisite:
      skill: "overcharge"
      level: 2
    gui:
      slot: 24
      icon: "MAGMA_BLOCK"
    levels:
      1:
        effect:
          magicScaling: 5.0
          damageType: "MAGIC"
          radius: 6
          fallDelay: 40
          burnDuration: 5
      2:
        effect:
          magicScaling: 6.5
          damageType: "MAGIC"
          radius: 7
          fallDelay: 35
          burnDuration: 6
      3:
        effect:
          magicScaling: 8.0
          damageType: "MAGIC"
          radius: 8
          fallDelay: 30
          burnDuration: 8

  # ═══════════════════════════════════════════
  #  灼燒流（DOT流）— 左側
  # ═══════════════════════════════════════════

  # 烈焰噴射 (4,2) → slot 38 — 主動：連續射火焰3秒
  flame_jet:
    name: "烈焰噴射"
