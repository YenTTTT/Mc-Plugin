          level: 1
        - skill: "chain_explosion"
          level: 1
    gui:
      slot: 25
      icon: "NETHER_STAR"
    levels:
      1:
        effect:
          skillDamageBonus: 0.15
          manaCostIncrease: 0.10
      2:
        effect:
          skillDamageBonus: 0.25
          manaCostIncrease: 0.15
      3:
        effect:
          skillDamageBonus: 0.35
          manaCostIncrease: 0.20

  # 隕石術 (2,6) → slot 24 — 終極：召喚隕石
