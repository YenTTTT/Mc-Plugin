    prerequisite:
      skill: "heat_rising"
      level: 1
    gui:
      slot: 38
      icon: "BLAZE_POWDER"
    levels:
      1:
        effect:
          magicScaling: 1.0
          damageType: "MAGIC"
          range: 8
          duration: 3
          tickInterval: 5
          burnDuration: 3
      2:
        effect:
          magicScaling: 1.2
          damageType: "MAGIC"
          range: 9
          duration: 4
          tickInterval: 5
          burnDuration: 4
      3:
