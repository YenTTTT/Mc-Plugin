        effect:
          magicScaling: 1.1
          damageType: "MAGIC"
          range: 10
          width: 3
          burnDuration: 3
      2:
        effect:
          magicScaling: 1.4
          damageType: "MAGIC"
          range: 12
          width: 4
          burnDuration: 4
      3:
        effect:
          magicScaling: 1.7
          damageType: "MAGIC"
          range: 14
          width: 5
          burnDuration: 5

