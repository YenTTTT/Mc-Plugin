# ============================================
# MMORPG 飾品系統配置文件
# 包含項鍊、戒指、手環、腰帶、護符、肩甲
#
# 槽位定義:
#   NECKLACE  — 項鍊（主輸出：STRENGTH / INTELLIGENCE）
#   RING_1/2  — 戒指（爆擊/敏捷：AGILITY 主）
#   BRACELET  — 手環（技能/回復：SPIRIT 主）
#   BELT      — 腰帶（血量：VITALITY 主）
#   CHARM     — 護符（法系/輔助：INTELLIGENCE + SPIRIT）
#   SHOULDER  — 肩甲（防禦：DEFENSE + VITALITY）
# ============================================

