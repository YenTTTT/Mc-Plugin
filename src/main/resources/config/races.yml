# ===================================
# CustomRPG - 種族配置檔案
# ===================================
# 每個種族包含：
#   - name: 顯示名稱 (支援顏色碼)
#   - description: 簡短描述
#   - base-stats: 基礎屬性加成
#   - growth: 每級成長倍率
#   - skills: 種族技能 (最多2個)
#   - weapon: 武器類型傷害加成
#       - default: 未列出的武器類型預設倍率
#       - bonuses: 各武器類型的傷害倍率
#   - passives: 被動效果
#
# 武器類型列表:
#   SWORD(劍), STAFF(法杖), SCYTHE(鐮刀),
#   TWO_HAND_SCYTHE(雙手鐮刀), AXE(斧), TWO_HAND_AXE(雙手斧),
#   BOW(弓), SPEAR(長槍), UNKNOWN(未知)
# ===================================

races:

  # ===== 人類 =====
  human:
    name: "§f人類"
    description: "平衡發展的種族，適合所有武器"

    base-stats:
      strength: 5
      agility: 5
      magic: 5
      vitality: 5
      defense: 5
      spirit: 5
      mana: 10
      mana-regen: 0.2

    growth:
      strength: 1.0
      agility: 1.0
      magic: 1.0
      vitality: 1.0
      defense: 1.0
      spirit: 1.0
      mana: 2.0
      mana-regen: 0.05

    skills:
      - focus
      - adaptability

    weapon:
      default: 1.0
      bonuses:
        SWORD: 1.1
        AXE: 1.05
        SPEAR: 1.05
        BOW: 1.0
        STAFF: 1.0

    passives:
      crit-chance: 0.0
      crit-damage: 0.0
      move-speed: 0.0
      health-regen: 0.0

