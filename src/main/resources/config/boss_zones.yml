# ========================================
# Boss 區域配置
# 在指定中心點半徑內：
# 1. 只允許該 Boss 與 linked-minions 生成
# 2. Boss 不能離開 radius 範圍
# 3. 非綁定自訂怪會被清除
# ========================================
boss-zones:
  blossom_temple_guardian:
    name: "Blossom Temple Guardian"
    world: "world"
    center: { x: 888, y: 133, z: 190 }
    radius: 200
    boss-mob-key: "boss_pumpkin_knight"
    linked-minions:
      - "shadow_archer"
      - "rotten_zombie"
      - "venomous_spider"
    boss-spawn-chance-per-cycle: 0.35
    respawn-cooldown-seconds: 900
    max-minions: 4
    minion-spawn-interval-ticks: 200
  greek_temple_warden:
    name: "Greek Temple Warden"
    world: "world"
    center: { x: -1032, y: 132, z: 227 }
    radius: 200
    boss-mob-key: "boss_crazy_scissor"
    linked-minions:
      - "skeleton_warrior"
      - "undead_knight"
      - "dark_ranger"
    boss-spawn-chance-per-cycle: 0.25
    respawn-cooldown-seconds: 1500
    max-minions: 6
    minion-spawn-interval-ticks: 180
  magma_core_volcano:
    name: "熔核火山"
    world: "world"
    center: { x: 900, y: 71, z: -600 }
    radius: 100
    boss-mob-key: "boss_magma_core"
    linked-minions:
      - "magma_core_medium"
      - "magma_core_small"
    boss-spawn-chance-per-cycle: 0.25
    respawn-cooldown-seconds: 1200
    max-minions: 0
    minion-spawn-interval-ticks: 200
