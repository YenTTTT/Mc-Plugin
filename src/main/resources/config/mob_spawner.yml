# ========================================
# 動態怪物生成系統配置
# DistanceSpawnManager Configuration
# ========================================

# 是否啟用自動生成系統 (配置總開關)
# 注意：即使這裡是 true，伺服器啟動後仍需管理員輸入 /finishrpg 才會開始生成自訂怪
enabled: true

# vanilla = 原版自然怪事件驅動；supplemental = 舊式玩家周圍定時補怪。
# 不可同時啟用兩套流程，避免怪物數量翻倍。
mode: vanilla

# 預設不接管刷怪籠、指令、突襲、試煉、繁殖及其他插件的 CUSTOM 生成。
natural-spawn-reasons:
  - NATURAL

leash:
  soft-distance: 48
  hard-distance: 80

# 是否啟用 debug 日誌 (在 console 輸出詳細生成過程，測試時建議開啟)
debug: false

# 生成檢查間隔 (ticks, 20 ticks = 1 秒)
interval-ticks: 60

# supplemental 模式每次檢查每位玩家最多嘗試生成幾隻怪
spawns-per-cycle: 3

# ===== 生成範圍 =====
spawn-radius:
  # 最小生成距離 (不會太靠近玩家)
  min: 10
  # 最大生成距離
  max: 35
  # 怪物之間最小距離
  min-between-mobs: 4

# ===== 數量限制 =====
limits:
  # 每位玩家附近最大自定義怪物數量
  max-mobs-per-player: 10
  max-mobs-per-chunk: 8

# ===== 怪物階級 =====
tiers:
  # 普通怪
  normal:
    # 名稱前綴 (空 = 不加)
    name-prefix: ""

  # 精英怪：最低 1%，每 10 級增加 1%，最高 7%；不突破區域等級上限。
  elite:
    chance: 0.01
    stat-multiplier: 1.5
    name-prefix: "&6⚔ "

  # Boss 僅由已啟用的舊式 Boss 區域或管理員指令生成，不混入普通自然怪池。
  boss:
    stat-multiplier: 3.0
    name-prefix: "&c✦ BOSS ✦ "
    # BOSS 生成時的粒子效果
    spawn-particle: FLAME
    spawn-particle-count: 100
    # BOSS 生成時的音效
    spawn-sound: ENTITY_ENDER_DRAGON_GROWL
    spawn-sound-volume: 2.0
    spawn-sound-pitch: 0.5

# 距離分區、各世界中心與維度等級改由 config/world_zones.yml 管理。
# 怪物 tags 決定環境池，spawn-time 決定時段，level-range 必須包含計算等級。
# 無匹配模板或生成失敗時保留原版怪物，不使用跨區域或跨時段備援怪物。

# ===== 生成條件 =====
conditions:
  # 是否只在夜晚生成 (false = 白天也生成)
  night-only: false
  # 最高允許光照 (15 = 無限制，0 = 只允許完全黑暗)
  max-light-level: 15
  # 地面上才生成 (排除空中)
  require-solid-ground: true
  # 需要空間 (腳+頭兩格空氣)
  require-air-space: true

# ===== 排除的世界 =====
disabled-worlds:
  - "world_the_end"

# 出生點安全區亦由 world_zones.yml 管理；舊地圖區域預設停用但不刪除。

