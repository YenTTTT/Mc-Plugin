# 1. 腐蝕殭屍 - 低等級常見怪
rotten_zombie:
  name: "&2腐蝕殭屍"
  type: ZOMBIE

  level-range:
    min: 1
    max: 15

  base-stats:
    health: 25.0
    damage: 4.0

  stat-scaling:
    health-per-level: 4.0
    damage-per-level: 0.8

  exp:
    base: 8
    per-level: 3

  drops:
    vanilla-items:
      - material: ROTTEN_FLESH
        amount: 1-3
        chance: 0.8
      - material: IRON_NUGGET
        amount: 1-2
        chance: 0.15

  special-behavior: "aggressive"
  show-level-in-name: true
  tags: [plains, forest, cave]

