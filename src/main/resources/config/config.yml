# CustomRPG Configuration File
# This is the main configuration file for general settings
# Specific configurations for weapons, skills, and mobs are in the configs/ folder:
#   - configs/weapons/scythes.yml
#   - configs/weapons/swords.yml
#   - configs/weapons/axes.yml
#   - configs/skills.yml
#   - configs/mobs.yml

# ===========================================
# GENERAL SETTINGS
# ===========================================

settings:
  debug-mode: false
  enable-custom-weapons: true
  enable-skills: true
  enable-custom-mobs: true

# Combat balance v2 is active; enable logging only when checking damage in a test server.
balance:
  debug-damage: false
