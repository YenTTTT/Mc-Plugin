world-events:
  enabled: true
  scheduler:
    min-interval-minutes: 45
    max-interval-minutes: 120
    retry-seconds: 300
  max-active-events: 1
  minimum-online-players: 1
  location:
    attempts-per-search: 32
    min-player-distance: 64
    max-player-distance: 256
    # Temporary meteor islands are built in empty space above the entire footprint.
    # Existing terrain is untouched; claims, border and build height still apply.
    protection-padding: 4
  terrain:
    blocks-per-tick: 128
  meteor:
    enabled: true
    duration-minutes: 20
    cleanup-delay-seconds: 120
    arena:
      radius: 12
      thickness: 3
      # Empty blocks between the highest existing terrain/building and the island bottom.
      clearance: 6
    crater:
      # Legacy radius fallback for existing installations; digging is no longer used.
      radius: 12
      max-depth: 4
      # Compatibility setting: height difference no longer rejects a candidate.
      max-height-difference: 5
    core:
      radius: 3
    animation:
      enabled: true
      falling-duration-ticks: 100
      starting-height: 80
      particles: true
      sounds: true
    mobs:
      - {template: meteor_parasite, count: 8, rank: NORMAL}
      - {template: astral_crawler, count: 4, rank: NORMAL}
      - {template: fallen_guardian, count: 4, rank: TANK}
      - {template: meteor_elite, count: 2, rank: ELITE}
      - {template: meteor_core_guardian, count: 1, rank: BOSS}
    contribution:
      minimum-damage: 1.0
      minimum-share: 0.01
    # Stored in the durable personal material wallet, atomically with the claim receipt.
    rewards:
      meteor_fragment: 12
      astral_crystal: 3
      meteor_core_fragment: 1
