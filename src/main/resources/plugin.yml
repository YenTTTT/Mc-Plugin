name: CustomRPG
version: '1.0'
main: com.customrpg.CustomRPG
api-version: '1.21'
description: A professional RPG plugin with custom weapons, skills, and mobs
author: CustomRPG Team
website: https://github.com/customrpg

commands:
  weapon:
    description: Give custom weapons to players
    usage: /weapon <weapon_name> [player] OR /weapon list OR /weapon reload
    permission: customrpg.weapon
    permission-message: You don't have permission to use this command!
    aliases: [weapons, customweapon, cweapon]
  custommob:
    description: Spawn and manage custom mobs
    usage: /custommob <spawn|list|info> [mob_key]
    permission: customrpg.mob
    permission-message: You don't have permission to use this command!
    aliases: [cmob, custommobs, spawncmob]
  rpg:
    description: Manage player stats and RPG features
    usage: /rpg <gui|stats|setstat|reload> [args]
    permission: customrpg.rpg
    permission-message: You don't have permission to use this command!
  stats:
    description: View and manage player stats
    usage: /stats [gui|player]
    permission: customrpg.rpg
    permission-message: You don't have permission to use this command!
    aliases: [playerstats]
  talent:
    description: Manage talent points and talent tree
    usage: /talent [warrior|mage|assassin|give|reset|info|reload|help]
    permission: customrpg.talent
    permission-message: You don't have permission to use this command!
    aliases: [talents, skill, skills]
  equipment:
    description: Manage equipment and gear
    usage: /equipment [open|give|enhance|info|list|reload|help]
    permission: customrpg.equipment
    permission-message: You don't have permission to use this command!
    aliases: [equip, gear, eq]
  stat:
    description: Display complete character information in chat
    usage: /stat
    permission: customrpg.stat
    permission-message: You don't have permission to use this command!
  mobspawn:
    description: 動態怪物生成系統管理與測試
    usage: /mobspawn <status|spawn|clear|debug|reload|help>
    permission: customrpg.admin
    permission-message: You don't have permission to use this command!
    aliases: [ms, mobsp]
  protectarea:
    description: 保護區域管理 — 區域內不生成怪物
    usage: /protectarea [name|list|remove|reload|help]
    permission: customrpg.admin
    permission-message: You don't have permission to use this command!
    aliases: [pa, protect]
  race:
    description: 種族系統 — 選擇種族、查看資訊
    usage: /race [info|set|reset|list|reload|help]
    permission: customrpg.race
    permission-message: You don't have permission to use this command!
    aliases: [races]
  setmob:
    description: 怪物區域管理 — 設定安全區域與怪物等級
    usage: /setmob [<minLevel> <maxLevel> <zoneId>|list|remove|info|tier|reload|help]
    permission: customrpg.admin
    permission-message: You don't have permission to use this command!
    aliases: [mobzone, mz]
  menu:
    description: 開啟主選單 GUI — 快速存取所有 RPG 功能
    usage: /menu [getitem]
    permission: customrpg.menu
    permission-message: You don't have permission to use this command!
    aliases: [m, mainmenu]
  mana:
    description: 魔力管理指令 — 切換無限/正常魔力模式
    usage: /mana <unlimit|limit>
    permission: customrpg.admin
    permission-message: You don't have permission to use this command!
  finishrpg:
    description: 啟動 RPG 自訂怪物生成系統
    usage: /finishrpg
    permission: customrpg.admin
    permission-message: You don't have permission to use this command!
  bosszone:
    description: Boss 區域管理 — 強制生成/移除/查看 Boss
    usage: /bosszone <list|spawn|remove|status|help> [zone_id]
    permission: customrpg.admin
    permission-message: You don't have permission to use this command!
    aliases: [bz, bosszones]




permissions:
  customrpg.*:
    description: Gives access to all CustomRPG features
    children:
      customrpg.weapon: true
      customrpg.weapon.others: true
      customrpg.rpg: true
      customrpg.stat: true
      customrpg.talent: true
      customrpg.talent.admin: true
      customrpg.mob: true
      customrpg.admin: true
      customrpg.equipment: true
      customrpg.equipment.give: true
      customrpg.equipment.reload: true
      customrpg.race: true
      customrpg.race.admin: true
      customrpg.menu: true
  customrpg.weapon:
    description: Allows using the /weapon command for yourself
    default: op
  customrpg.weapon.others:
    description: Allows giving weapons to other players
    default: op
  customrpg.rpg:
    description: Allows viewing own stats
    default: true
  customrpg.stat:
    description: Allows using /stat command to view character information
    default: true
  customrpg.talent:
    description: Allows using talent system and GUI
    default: true
  customrpg.talent.admin:
    description: Allows managing other players' talents
    default: op
  customrpg.equipment:
    description: Allows using equipment system and GUI
    default: true
  customrpg.equipment.give:
    description: Allows giving equipment to players
    default: op
  customrpg.equipment.reload:
    description: Allows reloading equipment configuration
    default: op
  customrpg.admin:
    description: Administrative access to all features
    default: op
  customrpg.race:
    description: Allows using race system and GUI
    default: true
  customrpg.race.admin:
    description: Allows managing other players' races
    default: op
  customrpg.menu:
    description: Allows using /menu command to open main menu
    default: true
